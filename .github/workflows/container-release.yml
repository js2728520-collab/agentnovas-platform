name: Publish versioned Riverton container images

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      version_tag: ${{ steps.identity.outputs.version_tag }}
      migration_version: ${{ steps.identity.outputs.migration_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - id: identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          identity="$(npm run --silent release:identity -- "$RELEASE_TAG")"
          node -e 'const value=JSON.parse(process.argv[1]); for (const [key,name] of [["version","version"],["versionTag","version_tag"],["migrationVersion","migration_version"]]) process.stdout.write(`${name}=${value[key]}\n`)' "$identity" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    needs: identity
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      INTEGRATION_CREDENTIAL_ENCRYPTION_KEY: ci-only-encryption-key-with-32-characters
      RIVERTON_RELEASE_TAG: ${{ needs.identity.outputs.version_tag }}
      GIT_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run postgres:migrate
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:apps
      # ADR-0019 最核心不变量的唯一机器验证：三个 Web 构建里不含交易所凭证的
      # 加解密能力。它此前定义了却没有任何自动化在跑——回归不会有人发现。
      # 必须排在 test:apps 之后：它扫的是构建产物。
      - run: npm run quality:key-custody
      - run: npm run quality:secret-scan
      - run: npm audit --omit=dev --audit-level=high

  publish:
    runs-on: ubuntu-latest
    needs: [identity, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: client
            target: web
            audience: client
            host: agentnovas.com
          - image: operations
            target: web
            audience: operations
            host: zht.agentnovas.com
          - image: maintenance
            target: web
            audience: maintenance
            host: xm.agentnovas.com
          - image: runtime
            target: runtime
            audience: ""
            host: ""
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/container/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            RIVERTON_APP_AUDIENCE=${{ matrix.audience }}
            RIVERTON_APP_HOST=${{ matrix.host }}
            RIVERTON_RELEASE_TAG=${{ needs.identity.outputs.version_tag }}
            GIT_COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.identity.outputs.version_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentnovas-riverton-${{ matrix.image }}:${{ needs.identity.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/agentnovas-riverton-${{ matrix.image }}:sha-${{ github.sha }}
      - env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION_TAG: ${{ needs.identity.outputs.version_tag }}
        run: |
          mkdir -p image-digest
          node -e 'const fs=require("node:fs"); fs.writeFileSync(`image-digest/${process.env.IMAGE_NAME}.json`, JSON.stringify({image:process.env.IMAGE_NAME,versionTag:process.env.VERSION_TAG,digest:process.env.IMAGE_DIGEST})+"\n")'
      - uses: actions/upload-artifact@v6
        with:
          name: riverton-${{ matrix.image }}-${{ needs.identity.outputs.version_tag }}
          path: image-digest/*.json
          if-no-files-found: error
          retention-days: 90

  manifest:
    runs-on: ubuntu-latest
    needs: [identity, publish]
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: riverton-*-${{ needs.identity.outputs.version_tag }}
          path: image-digests
          merge-multiple: true
      - env:
          VERSION: ${{ needs.identity.outputs.version }}
          VERSION_TAG: ${{ needs.identity.outputs.version_tag }}
          COMMIT_SHA: ${{ github.sha }}
          MIGRATION_VERSION: ${{ needs.identity.outputs.migration_version }}
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readdirSync, readFileSync, writeFileSync } = require("node:fs");
          const images = readdirSync("image-digests").filter(name => name.endsWith(".json"))
            .map(name => JSON.parse(readFileSync(`image-digests/${name}`, "utf8")))
            .sort((left, right) => left.image.localeCompare(right.image));
          if (images.length !== 4 || images.some(image => !/^sha256:[a-f0-9]{64}$/.test(image.digest))) {
            throw new Error("Expected four immutable container digests");
          }
          const identity = {
            version: process.env.VERSION,
            versionTag: process.env.VERSION_TAG,
            commitSha: process.env.COMMIT_SHA,
            migrationVersion: process.env.MIGRATION_VERSION,
            images,
          };
          const artifactSha256 = createHash("sha256").update(JSON.stringify(identity)).digest("hex");
          writeFileSync("riverton-release-manifest.json", `${JSON.stringify({ ...identity, artifactSha256 }, null, 2)}\n`);
          writeFileSync(process.env.GITHUB_STEP_SUMMARY, `## ${identity.versionTag}\n\nArtifact SHA-256: \`${artifactSha256}\`\n`);
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: riverton-release-manifest-${{ needs.identity.outputs.version_tag }}
          path: riverton-release-manifest.json
          if-no-files-found: error
          retention-days: 365
