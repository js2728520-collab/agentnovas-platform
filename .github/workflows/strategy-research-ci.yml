name: Strategy research verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      INTEGRATION_CREDENTIAL_ENCRYPTION_KEY: ci-only-encryption-key-with-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run postgres:migrate
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:apps
      - run: npm run test:smoke:built
      - run: npm audit --omit=dev --audit-level=critical
