name: Build immutable preview candidate

on:
  push:
    branches: ["codex/release-transition-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      version_tag: ${{ steps.identity.outputs.version_tag }}
      runtime_version_tag: ${{ steps.identity.outputs.runtime_version_tag }}
      candidate_tag: ${{ steps.identity.outputs.candidate_tag }}
      migration_version: ${{ steps.identity.outputs.migration_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - id: identity
        run: |
          identity="$(npm run --silent release:candidate-identity)"
          # shellcheck disable=SC2016
          node -e 'const value=JSON.parse(process.argv[1]); for (const [key,name] of [["version","version"],["versionTag","version_tag"],["runtimeVersionTag","runtime_version_tag"],["candidateTag","candidate_tag"],["migrationVersion","migration_version"]]) process.stdout.write(`${name}=${value[key]}\n`)' "$identity" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      INTEGRATION_CREDENTIAL_ENCRYPTION_KEY: ci-only-encryption-key-with-32-characters
      PAYMENT_WORKER_ENABLED: "false"
      PAYMENT_PROVIDER_TESTS_ENABLED: "false"
      NOTIFICATION_WORKER_ENABLED: "false"
      NOTIFICATION_EMAIL_SEND_ENABLED: "false"
      DEMO_EXECUTION_WORKER_ENABLED: "false"
      PLATFORM_DEMO_EXTERNAL_WRITES_ENABLED: "false"
      STRATEGY_RESEARCH_ENABLED: "false"
      STRATEGY_RUNTIME_ENABLED: "false"
      AI_GATEWAY_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run postgres:migrate
      - run: npm run test:packages
      - run: npm run pack:packages
      - run: npm test
      - run: npx tsc --noEmit --incremental false
      - run: npm run lint
      - run: npm run test:apps
      - run: npm run test:smoke:built
      - run: npm run quality:boundaries
      - run: npm run quality:key-custody
      - run: npm run quality:secret-scan
      - run: npm audit --omit=dev --audit-level=high

  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [identity, verify]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: client
            target: web
            audience: client
            host: test.agentnovas.com
          - image: operations
            target: web
            audience: operations
            host: ops-test.agentnovas.com
          - image: maintenance
            target: web
            audience: maintenance
            host: main-test.agentnovas.com
          - image: runtime
            target: runtime
            audience: ""
            host: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/container/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            RIVERTON_APP_AUDIENCE=${{ matrix.audience }}
            RIVERTON_APP_HOST=${{ matrix.host }}
            RIVERTON_RELEASE_TAG=${{ needs.identity.outputs.runtime_version_tag }}
            GIT_COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.identity.outputs.runtime_version_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ needs.identity.outputs.candidate_tag }}
          tags: ghcr.io/${{ github.repository_owner }}/agentnovas-riverton-${{ matrix.image }}:${{ needs.identity.outputs.candidate_tag }}
      - env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          CANDIDATE_TAG: ${{ needs.identity.outputs.candidate_tag }}
          RUNTIME_VERSION_TAG: ${{ needs.identity.outputs.runtime_version_tag }}
        run: |
          mkdir -p image-digest
          # shellcheck disable=SC2016
          node -e 'const fs=require("node:fs"); fs.writeFileSync(`image-digest/${process.env.IMAGE_NAME}.json`, JSON.stringify({image:process.env.IMAGE_NAME,candidateTag:process.env.CANDIDATE_TAG,runtimeVersionTag:process.env.RUNTIME_VERSION_TAG,digest:process.env.IMAGE_DIGEST})+"\n")'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: preview-${{ matrix.image }}-${{ github.sha }}
          path: image-digest/*.json
          if-no-files-found: error
          retention-days: 30

  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [identity, publish]
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: preview-*-${{ github.sha }}
          path: image-digests
          merge-multiple: true
      - env:
          VERSION: ${{ needs.identity.outputs.version }}
          VERSION_TAG: ${{ needs.identity.outputs.version_tag }}
          RUNTIME_VERSION_TAG: ${{ needs.identity.outputs.runtime_version_tag }}
          CANDIDATE_TAG: ${{ needs.identity.outputs.candidate_tag }}
          COMMIT_SHA: ${{ github.sha }}
          MIGRATION_VERSION: ${{ needs.identity.outputs.migration_version }}
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readdirSync, readFileSync, writeFileSync } = require("node:fs");
          const images = readdirSync("image-digests").filter(name => name.endsWith(".json"))
            .map(name => JSON.parse(readFileSync(`image-digests/${name}`, "utf8")))
            .sort((left, right) => left.image.localeCompare(right.image));
          if (images.length !== 4 || images.some(image => !/^sha256:[a-f0-9]{64}$/.test(image.digest))) {
            throw new Error("Expected four immutable preview image digests");
          }
          const identity = {
            version: process.env.VERSION,
            versionTag: process.env.VERSION_TAG,
            runtimeVersionTag: process.env.RUNTIME_VERSION_TAG,
            candidateTag: process.env.CANDIDATE_TAG,
            commitSha: process.env.COMMIT_SHA,
            migrationVersion: process.env.MIGRATION_VERSION,
            images,
          };
          const artifactSha256 = createHash("sha256").update(JSON.stringify(identity)).digest("hex");
          writeFileSync("preview-candidate-manifest.json", `${JSON.stringify({ ...identity, artifactSha256 }, null, 2)}\n`);
          writeFileSync(process.env.GITHUB_STEP_SUMMARY, `## ${identity.runtimeVersionTag}\n\nArtifact SHA-256: \`${artifactSha256}\`\n\nThis workflow creates a delivery candidate only. It never deploys main or production.\n`);
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: preview-candidate-manifest-${{ github.sha }}
          path: preview-candidate-manifest.json
          if-no-files-found: error
          retention-days: 90
