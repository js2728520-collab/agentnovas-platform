name: agentnovas-riverton

x-web-security: &web-security
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s

x-worker-security: &worker-security
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 45s

services:
  postgres:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentnovas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backplane]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d agentnovas"]
      interval: 10s
      timeout: 5s
      retries: 12
    shm_size: 256mb
    security_opt: [no-new-privileges:true]

  client:
    <<: *web-security
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-client:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/client.env, server.js]
    environment:
      RIVERTON_APP_AUDIENCE: client
      RIVERTON_RELEASE_TAG: v${RIVERTON_RELEASE_VERSION}
      GIT_COMMIT_SHA: ${RIVERTON_COMMIT_SHA:?set RIVERTON_COMMIT_SHA}
      RIVERTON_ARTIFACT_SHA256: ${RIVERTON_ARTIFACT_SHA256:?set RIVERTON_ARTIFACT_SHA256}
    secrets:
      - source: client_env
        target: client.env
    volumes:
      - type: bind
        source: ${RIVERTON_PAYMENT_SECRET_DIR:-/etc/agentnovas-riverton/payment-managed}
        target: /run/payment-secrets
        read_only: true
    ports: ["127.0.0.1:${RIVERTON_CLIENT_PORT:-3100}:3000"]
    tmpfs:
      - /tmp:mode=1777
      - /app/.next-client/cache:uid=1000,gid=1000,mode=0700
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      backplane: {}
      edge: { aliases: [riverton-client] }

  operations:
    <<: *web-security
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-operations:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/operations.env, server.js]
    environment:
      RIVERTON_APP_AUDIENCE: operations
      RIVERTON_RELEASE_TAG: v${RIVERTON_RELEASE_VERSION}
      GIT_COMMIT_SHA: ${RIVERTON_COMMIT_SHA:?set RIVERTON_COMMIT_SHA}
      RIVERTON_ARTIFACT_SHA256: ${RIVERTON_ARTIFACT_SHA256:?set RIVERTON_ARTIFACT_SHA256}
    secrets:
      - source: operations_env
        target: operations.env
    ports: ["127.0.0.1:${RIVERTON_OPERATIONS_PORT:-3101}:3000"]
    tmpfs:
      - /tmp:mode=1777
      - /app/.next-operations/cache:uid=1000,gid=1000,mode=0700
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      backplane: {}
      edge: { aliases: [riverton-operations] }

  maintenance:
    <<: *web-security
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-maintenance:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/maintenance.env, server.js]
    environment:
      RIVERTON_APP_AUDIENCE: maintenance
      RIVERTON_RELEASE_TAG: v${RIVERTON_RELEASE_VERSION}
      GIT_COMMIT_SHA: ${RIVERTON_COMMIT_SHA:?set RIVERTON_COMMIT_SHA}
      RIVERTON_ARTIFACT_SHA256: ${RIVERTON_ARTIFACT_SHA256:?set RIVERTON_ARTIFACT_SHA256}
    secrets:
      - source: maintenance_env
        target: maintenance.env
      - source: email_secret_broker_public_key
        target: email-secret-broker-public.pem
        uid: "1000"
        gid: "1000"
        mode: 0444
      - source: payment_secret_broker_public_key
        target: payment-secret-broker-public.pem
        uid: "1000"
        gid: "1000"
        mode: 0444
    volumes:
      - type: bind
        source: ${RIVERTON_EMAIL_SECRET_DIR:-/etc/agentnovas-riverton/email-managed}
        target: /run/email-secrets
        read_only: true
      - type: bind
        source: ${RIVERTON_PAYMENT_SECRET_DIR:-/etc/agentnovas-riverton/payment-managed}
        target: /run/payment-secrets
        read_only: true
    ports: ["127.0.0.1:${RIVERTON_MAINTENANCE_PORT:-3102}:3000"]
    tmpfs:
      - /tmp:mode=1777
      - /app/.next-maintenance/cache:uid=1000,gid=1000,mode=0700
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      backplane: {}
      edge: { aliases: [riverton-maintenance] }

  notification-worker:
    <<: *worker-security
    profiles: [workers]
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-runtime:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/notification.env, --experimental-strip-types, scripts/notification-worker.mjs]
    secrets:
      - source: notification_env
        target: notification.env
    volumes:
      - type: bind
        source: ${RIVERTON_EMAIL_SECRET_DIR:-/etc/agentnovas-riverton/email-managed}
        target: /run/email-secrets
        read_only: true
    tmpfs: [/tmp:mode=1777]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backplane, egress]

  email-secret-broker:
    <<: *worker-security
    profiles: [email-secret-broker]
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-runtime:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/email-secret-broker.env, --experimental-strip-types, scripts/email-secret-broker-worker.mjs]
    secrets:
      - source: email_secret_broker_env
        target: email-secret-broker.env
      - source: email_secret_broker_private_key
        target: email-secret-broker-private.pem
        uid: "1000"
        gid: "1000"
        mode: 0400
    volumes:
      - type: bind
        source: ${RIVERTON_EMAIL_SECRET_DIR:-/etc/agentnovas-riverton/email-managed}
        target: /run/email-secrets
    tmpfs: [/tmp:mode=1777]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backplane]

  payment-secret-broker:
    <<: *worker-security
    profiles: [payment-secret-broker]
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-runtime:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/payment-secret-broker.env, --experimental-strip-types, scripts/payment-secret-broker-worker.mjs]
    secrets:
      - source: payment_secret_broker_env
        target: payment-secret-broker.env
      - source: payment_secret_broker_private_key
        target: payment-secret-broker-private.pem
        uid: "1000"
        gid: "1000"
        mode: 0400
    volumes:
      - type: bind
        source: ${RIVERTON_PAYMENT_SECRET_DIR:-/etc/agentnovas-riverton/payment-managed}
        target: /run/payment-secrets
    tmpfs: [/tmp:mode=1777]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backplane]

  configuration-activation-worker:
    <<: *worker-security
    profiles: [configuration-activation]
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-runtime:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/configuration-activation.env, --experimental-strip-types, scripts/configuration-activation-worker.mjs]
    secrets:
      - source: configuration_activation_env
        target: configuration-activation.env
    tmpfs: [/tmp:mode=1777]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backplane]

  release-orchestrator-staging:
    <<: *worker-security
    profiles: [restricted-cicd]
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-runtime:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/release-orchestrator-staging.env, --experimental-strip-types, scripts/release-orchestrator-worker.mjs]
    environment:
      NODE_USE_ENV_PROXY: "1"
    secrets:
      - source: release_orchestrator_staging_env
        target: release-orchestrator-staging.env
      - source: release_orchestrator_staging_binding
        target: release-orchestrator-binding.json
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: release_orchestrator_staging_app_key
        target: release-orchestrator-app.pem
        uid: "1000"
        gid: "1000"
        mode: 0400
    tmpfs: [/tmp:mode=1777]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backplane, egress]

  release-orchestrator-production:
    <<: *worker-security
    profiles: [restricted-cicd]
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-runtime:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/release-orchestrator-production.env, --experimental-strip-types, scripts/release-orchestrator-worker.mjs]
    environment:
      NODE_USE_ENV_PROXY: "1"
    secrets:
      - source: release_orchestrator_production_env
        target: release-orchestrator-production.env
      - source: release_orchestrator_production_binding
        target: release-orchestrator-binding.json
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: release_orchestrator_production_app_key
        target: release-orchestrator-app.pem
        uid: "1000"
        gid: "1000"
        mode: 0400
    tmpfs: [/tmp:mode=1777]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backplane, egress]

  release-provider-security-auditor-staging:
    <<: *worker-security
    profiles: [restricted-cicd]
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-runtime:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/release-auditor-staging.env, --experimental-strip-types, scripts/release-provider-security-auditor.mjs]
    environment:
      NODE_USE_ENV_PROXY: "1"
      RELEASE_AUDITOR_HOST: "0.0.0.0"
      RELEASE_AUDITOR_POLICY_FILE: /run/secrets/release-auditor-policy.json
      RELEASE_AUDITOR_APP_PRIVATE_KEY_FILE: /run/secrets/release-auditor-app.pem
      RELEASE_AUDITOR_ATTESTATION_PRIVATE_KEY_FILE: /run/secrets/release-auditor-attestation-ed25519.pem
      RELEASE_AUDITOR_SHARED_SECRET_FILE: /run/secrets/release-auditor-shared-secret
    ports:
      - "127.0.0.1:${RELEASE_AUDITOR_HOST_PORT:-3316}:3316"
    secrets:
      - source: release_auditor_staging_env
        target: release-auditor-staging.env
      - source: release_auditor_staging_policy
        target: release-auditor-policy.json
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: release_auditor_staging_app_key
        target: release-auditor-app.pem
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: release_auditor_staging_attestation_key
        target: release-auditor-attestation-ed25519.pem
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: release_auditor_staging_shared_secret
        target: release-auditor-shared-secret
        uid: "1000"
        gid: "1000"
        mode: 0400
    tmpfs: [/tmp:mode=1777]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backplane, egress]

  release-provider-security-auditor-production:
    <<: *worker-security
    profiles: [restricted-cicd]
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-runtime:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/release-auditor-production.env, --experimental-strip-types, scripts/release-provider-security-auditor.mjs]
    environment:
      NODE_USE_ENV_PROXY: "1"
      RELEASE_AUDITOR_HOST: "0.0.0.0"
      RELEASE_AUDITOR_POLICY_FILE: /run/secrets/release-auditor-policy.json
      RELEASE_AUDITOR_APP_PRIVATE_KEY_FILE: /run/secrets/release-auditor-app.pem
      RELEASE_AUDITOR_ATTESTATION_PRIVATE_KEY_FILE: /run/secrets/release-auditor-attestation-ed25519.pem
      RELEASE_AUDITOR_SHARED_SECRET_FILE: /run/secrets/release-auditor-shared-secret
    ports:
      - "127.0.0.1:${RELEASE_AUDITOR_PRODUCTION_HOST_PORT:-3317}:3316"
    secrets:
      - source: release_auditor_production_env
        target: release-auditor-production.env
      - source: release_auditor_production_policy
        target: release-auditor-policy.json
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: release_auditor_production_app_key
        target: release-auditor-app.pem
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: release_auditor_production_attestation_key
        target: release-auditor-attestation-ed25519.pem
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: release_auditor_production_shared_secret
        target: release-auditor-shared-secret
        uid: "1000"
        gid: "1000"
        mode: 0400
    tmpfs: [/tmp:mode=1777]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backplane, egress]

  release-webhook-ingress:
    <<: *worker-security
    profiles: [restricted-cicd]
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-runtime:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/release-webhook.env, --experimental-strip-types, scripts/release-webhook-ingress.mjs]
    environment:
      RELEASE_WEBHOOK_HOST: "0.0.0.0"
    secrets:
      - source: release_webhook_env
        target: release-webhook.env
      - source: release_webhook_binding
        target: release-webhook-binding.json
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: release_webhook_secret
        target: release-webhook-secret
        uid: "1000"
        gid: "1000"
        mode: 0400
    tmpfs: [/tmp:mode=1777]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backplane, edge]

  release-identity-verifier:
    <<: *worker-security
    profiles: [restricted-cicd]
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-runtime:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/release-identity-verifier.env, --experimental-strip-types, scripts/release-identity-verifier.mjs]
    environment:
      RELEASE_IDENTITY_VERIFIER_HOST: "0.0.0.0"
    secrets:
      - source: release_identity_verifier_env
        target: release-identity-verifier.env
      - source: release_identity_verifier_webauthn_policy
        target: release-identity-verifier-webauthn-policy.json
        uid: "1000"
        gid: "1000"
        mode: 0400
    tmpfs: [/tmp:mode=1777]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backplane]

  release-control:
    <<: *worker-security
    profiles: [restricted-cicd]
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-runtime:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/release-control.env, --experimental-strip-types, scripts/release-control-gateway.mjs]
    environment:
      RELEASE_CONTROL_HOST: "0.0.0.0"
    secrets:
      - source: release_control_env
        target: release-control.env
    tmpfs: [/tmp:mode=1777]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backplane]

  runtime-worker:
    <<: *worker-security
    profiles: [workers]
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-runtime:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/runtime.env, --experimental-strip-types, scripts/strategy-runtime-worker.mjs]
    secrets:
      - source: runtime_env
        target: runtime.env
    tmpfs: [/tmp:mode=1777]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backplane, egress]

  demo-worker:
    <<: *worker-security
    profiles: [workers]
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-runtime:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/demo.env, --experimental-strip-types, scripts/platform-demo-worker.mjs]
    secrets:
      - source: demo_env
        target: demo.env
    tmpfs: [/tmp:mode=1777]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backplane, egress]

  execution:
    <<: *worker-security
    profiles: [workers]
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-runtime:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/execution.env, --experimental-strip-types, scripts/execution-service.mjs]
    secrets:
      - source: execution_env
        target: execution.env
    tmpfs: [/tmp:mode=1777]
    depends_on:
      postgres: { condition: service_healthy }
    # 只挂 backplane 与 egress：**不挂 edge**。
    #
    # 这个进程是全系统唯一持有 EXCHANGE_CREDENTIAL_ENCRYPTION_KEY 的地方，
    # 它的端口等价于「替任何客户下单」的能力。挂上 edge 就等于把它暴露到反向代理
    # 后面，第 2 步收敛密钥的意义会被这一行抵消（ADR-0019）。
    # egress 是它访问交易所 API 所必需的。
    networks: [backplane, egress]

  migrator:
    profiles: [tools]
    image: ${RIVERTON_IMAGE_PREFIX:-agentnovas-riverton}-runtime:${RIVERTON_RELEASE_VERSION:?set RIVERTON_RELEASE_VERSION}
    command: [node, --env-file=/run/secrets/migrator.env, --experimental-strip-types, scripts/apply-postgres-migrations.mjs]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    secrets:
      - source: migrator_env
        target: migrator.env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backplane]

secrets:
  postgres_password:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/postgres-password
  client_env:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/client.env
  operations_env:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/operations.env
  maintenance_env:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/maintenance.env
  notification_env:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/notification.env
  email_secret_broker_env:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/email-secret-broker.env
  email_secret_broker_public_key:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/email-secret-broker-public.pem
  email_secret_broker_private_key:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/email-secret-broker-private.pem
  payment_secret_broker_env:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/payment-secret-broker.env
  payment_secret_broker_public_key:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/payment-secret-broker-public.pem
  payment_secret_broker_private_key:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/payment-secret-broker-private.pem
  configuration_activation_env:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/configuration-activation.env
  release_orchestrator_staging_env:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-orchestrator-staging.env
  release_orchestrator_staging_binding:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-orchestrator-staging-binding.json
  release_orchestrator_staging_app_key:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-orchestrator-staging-app.pem
  release_orchestrator_production_env:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-orchestrator-production.env
  release_orchestrator_production_binding:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-orchestrator-production-binding.json
  release_orchestrator_production_app_key:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-orchestrator-production-app.pem
  release_auditor_staging_env:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-auditor-staging.env
  release_auditor_staging_policy:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-auditor-staging-policy.json
  release_auditor_staging_app_key:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-auditor-staging-app.pem
  release_auditor_staging_attestation_key:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-auditor-staging-attestation-ed25519.pem
  release_auditor_staging_shared_secret:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-auditor-staging-shared-secret
  release_auditor_production_env:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-auditor-production.env
  release_auditor_production_policy:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-auditor-production-policy.json
  release_auditor_production_app_key:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-auditor-production-app.pem
  release_auditor_production_attestation_key:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-auditor-production-attestation-ed25519.pem
  release_auditor_production_shared_secret:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-auditor-production-shared-secret
  release_webhook_env:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-webhook.env
  release_webhook_binding:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-webhook-binding.json
  release_webhook_secret:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-webhook-secret
  release_identity_verifier_env:
    file: ${RIVERTON_SECRET_DIR:-/etc/agentnovas-riverton}/release-identity-verifier.env
  release_identity_verifier_webauthn_policy:
