# 由 scripts/generate-nginx-api-allowlist.mjs 生成，请勿手改。
# vhost: zht.agentnovas.com
# 放行 20 条子树规则 + 0 条精确规则
#
# nginx map 的正则按定义顺序求值，首个命中生效：白名单在前判 0（放行），
# 末尾的 ~^/api/ 兜底判 1（拒绝）。非 /api 路径命中 default 0，不受影响。

map $uri $riverton_operations_api_denied {
  default 0;

  # 整棵子树都属于本 audience，可以按前缀放行。
  "~^/api/access$"  0;
  "~^/api/access/"  0;
  "~^/api/account/preferences$"  0;
  "~^/api/account/preferences/"  0;
  "~^/api/account/sessions$"  0;
  "~^/api/account/sessions/"  0;
  "~^/api/approvals$"  0;
  "~^/api/approvals/"  0;
  "~^/api/attributions$"  0;
  "~^/api/attributions/"  0;
  "~^/api/auth/login$"  0;
  "~^/api/auth/login/"  0;
  "~^/api/auth/logout$"  0;
  "~^/api/auth/logout/"  0;
  "~^/api/auth/me$"  0;
  "~^/api/auth/me/"  0;
  "~^/api/auth/mfa$"  0;
  "~^/api/auth/mfa/"  0;
  "~^/api/auth/reset-password$"  0;
  "~^/api/auth/reset-password/"  0;
  "~^/api/data-center$"  0;
  "~^/api/data-center/"  0;
  "~^/api/employee$"  0;
  "~^/api/employee/"  0;
  "~^/api/finance$"  0;
  "~^/api/finance/"  0;
  "~^/api/health$"  0;
  "~^/api/health/"  0;
  "~^/api/invitations$"  0;
  "~^/api/invitations/"  0;
  "~^/api/operations$"  0;
  "~^/api/operations/"  0;
  "~^/api/organization$"  0;
  "~^/api/organization/"  0;
  "~^/api/public-pool$"  0;
  "~^/api/public-pool/"  0;
  "~^/api/reports$"  0;
  "~^/api/reports/"  0;
  "~^/api/team$"  0;
  "~^/api/team/"  0;

  # 其余 /api 一律在边缘拒绝，不进 Node。
  "~^/api/"  1;
}
