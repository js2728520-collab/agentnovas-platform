# 由 scripts/generate-nginx-api-allowlist.mjs 生成，请勿手改。
# vhost: agentnovas.com
# 放行 28 条子树规则 + 0 条精确规则
#
# nginx map 的正则按定义顺序求值，首个命中生效：白名单在前判 0（放行），
# 末尾的 ~^/api/ 兜底判 1（拒绝）。非 /api 路径命中 default 0，不受影响。

map $uri $riverton_client_api_denied {
  default 0;

  # 整棵子树都属于本 audience，可以按前缀放行。
  "~^/api/access/me$"  0;
  "~^/api/access/me/"  0;
  "~^/api/account$"  0;
  "~^/api/account/"  0;
  "~^/api/ai$"  0;
  "~^/api/ai/"  0;
  "~^/api/auth$"  0;
  "~^/api/auth/"  0;
  "~^/api/automation$"  0;
  "~^/api/automation/"  0;
  "~^/api/credits$"  0;
  "~^/api/credits/"  0;
  "~^/api/exchange-accounts$"  0;
  "~^/api/exchange-accounts/"  0;
  "~^/api/health$"  0;
  "~^/api/health/"  0;
  "~^/api/integrations/catalog$"  0;
  "~^/api/integrations/catalog/"  0;
  "~^/api/market$"  0;
  "~^/api/market/"  0;
  "~^/api/membership$"  0;
  "~^/api/membership/"  0;
  "~^/api/notifications$"  0;
