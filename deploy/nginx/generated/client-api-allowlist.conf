  "~^/api/platform-strategy-subscriptions/"  0;
  "~^/api/portfolio$"  0;
  "~^/api/portfolio/"  0;
  "~^/api/risk$"  0;
  "~^/api/risk/"  0;
  "~^/api/simulated-orders$"  0;
