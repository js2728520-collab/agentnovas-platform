# 由 scripts/generate-nginx-api-allowlist.mjs 生成，请勿手改。
# vhost: xm.agentnovas.com
# 放行 14 条子树规则 + 0 条精确规则
#
# nginx map 的正则按定义顺序求值，首个命中生效：白名单在前判 0（放行），
# 末尾的 ~^/api/ 兜底判 1（拒绝）。非 /api 路径命中 default 0，不受影响。

map $uri $riverton_maintenance_api_denied {
  default 0;

  # 整棵子树都属于本 audience，可以按前缀放行。
  "~^/api/access$"  0;
  "~^/api/access/"  0;
  "~^/api/account/sessions$"  0;
  "~^/api/account/sessions/"  0;
  "~^/api/admin$"  0;
  "~^/api/admin/"  0;
  "~^/api/auth/login$"  0;
  "~^/api/auth/login/"  0;
  "~^/api/auth/logout$"  0;
  "~^/api/auth/logout/"  0;
  "~^/api/auth/me$"  0;
  "~^/api/auth/me/"  0;
  "~^/api/auth/mfa$"  0;
  "~^/api/auth/mfa/"  0;
  "~^/api/auth/reset-password$"  0;
  "~^/api/auth/reset-password/"  0;
  "~^/api/health$"  0;
  "~^/api/health/"  0;
  "~^/api/integrations/payments$"  0;
  "~^/api/integrations/payments/"  0;
  "~^/api/integrations/resend$"  0;
  "~^/api/integrations/resend/"  0;
  "~^/api/maintenance$"  0;
  "~^/api/maintenance/"  0;
  "~^/api/organization/staff-register$"  0;
  "~^/api/organization/staff-register/"  0;
  "~^/api/system$"  0;
  "~^/api/system/"  0;

  # 其余 /api 一律在边缘拒绝，不进 Node。
  "~^/api/"  1;
}
