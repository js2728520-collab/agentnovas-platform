map $http_upgrade $riverton_connection_upgrade {
  default upgrade;
  '' close;
}

# 每个 vhost 的 /api 前缀白名单，由 scripts/generate-nginx-api-allowlist.mjs
# 从 lib/api-route-inventory.ts 生成。三个应用编译同一份 API 面，这层把跨端
# 请求挡在 Node 之外——纵深防御的第一层，应用层的 fail-closed 校验仍然保留。
include /etc/nginx/riverton/generated/client-api-allowlist.conf;
include /etc/nginx/riverton/generated/operations-api-allowlist.conf;
include /etc/nginx/riverton/generated/maintenance-api-allowlist.conf;

server {
  listen 80;
  listen [::]:80;
  server_name agentnovas.com www.agentnovas.com zht.agentnovas.com xm.agentnovas.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name agentnovas.com;

  ssl_certificate /etc/letsencrypt/live/agentnovas.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/agentnovas.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 1m;

  location / {
    # 不属于本 vhost 的 /api 前缀在边缘拒绝，不进 Node。
    if ($riverton_client_api_denied) { return 404; }

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $riverton_connection_upgrade;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name zht.agentnovas.com;

  ssl_certificate /etc/letsencrypt/live/agentnovas.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/agentnovas.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 1m;

  location / {
    # 不属于本 vhost 的 /api 前缀在边缘拒绝，不进 Node。
    if ($riverton_operations_api_denied) { return 404; }

    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name xm.agentnovas.com;

  ssl_certificate /etc/letsencrypt/live/agentnovas.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/agentnovas.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 1m;

  location = /api/integrations/resend/webhook {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/integrations/payments/[^/]+/webhook$ {
    return 404;
  }

  location / {
    # 不属于本 vhost 的 /api 前缀在边缘拒绝，不进 Node。
    if ($riverton_maintenance_api_denied) { return 404; }

    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.agentnovas.com;
  ssl_certificate /etc/letsencrypt/live/agentnovas.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/agentnovas.com/privkey.pem;
  return 301 https://agentnovas.com$request_uri;
}
