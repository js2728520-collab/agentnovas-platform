map $http_upgrade $agentnovas_connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name agentnovas.com www.agentnovas.com;
  return 301 https://agentnovas.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name agentnovas.com;

  ssl_certificate /etc/letsencrypt/live/agentnovas.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/agentnovas.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 1m;

  location ~ ^/api/strategy-research/runs/[^/]+/events$ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $agentnovas_connection_upgrade;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.agentnovas.com;
  ssl_certificate /etc/letsencrypt/live/agentnovas.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/agentnovas.com/privkey.pem;
  return 301 https://agentnovas.com$request_uri;
}
